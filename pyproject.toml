[project]
name = "smon"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
smon = "smon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["smon.py", "smon_tui.py"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
rich = ">=13"
textual = ">=8.2.8,<9"

[tool.pixi.pypi-dependencies]
smon = { path = ".", editable = true }

[tool.pixi.tasks]
smon = "smon"
once = "smon --once"
